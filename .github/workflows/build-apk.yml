name: Build APK

on:
  push:
    branches: [ "android-app" ]
    paths-ignore: [ "tools/**", "photos/**", ".github/workflows/photos.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/Panda-RealSize-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Panda-RealSize-${{ github.run_number }}
          path: out/*.apk

      - name: Publish a download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "باندا مقاس حقيقي – نسخة ${{ github.run_number }}"
          body: "نزّل ملف الـ APK على الموبايل وثبّته. لو الموبايل طلب، اسمح بالتثبيت من مصادر غير معروفة."
          files: out/*.apk
          make_latest: true
